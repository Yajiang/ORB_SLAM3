%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "KannalaBrandt8"
# front left Camera calibration and distortion parameters (OpenCV)
Camera1.fx: 250.0
Camera1.fy: 250.0
Camera1.cx: 150.0
Camera1.cy: 150.0

# Kannala-Brandt distortion parameters
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.k3: 0.0
Camera1.k4: 0.0

# front right Camera calibration and distortion parameters (OpenCV)
Camera2.fx: 250.0
Camera2.fy: 250.0
Camera2.cx: 150.0
Camera2.cy: 150.0

# Kannala-Brandt distortion parameters
Camera2.k1: 0.0
Camera2.k2: 0.0
Camera2.k3: 0.0
Camera2.k4: 0.0

# left Camera calibration and distortion parameters (OpenCV)
Camera3.fx: 253.74469953582386
Camera3.fy: 253.00898309533483
Camera3.cx: 414.9536792684886
Camera3.cy: 300.4558254416866

# Kannala-Brandt distortion parameters
Camera3.k1: -0.0158716
Camera3.k2: -0.00253978
Camera3.k3: -0.000803488
Camera3.k4: -1.33842e-05

# right Camera calibration and distortion parameters (OpenCV)
Camera4.fx: 252.95915664247718
Camera4.fy: 252.13610147317542
Camera4.cx: 387.4686667372588
Camera4.cy: 310.03953448477324

# Kannala-Brandt distortion parameters
Camera4.k1: -0.0176681
Camera4.k2: -0.00200084
Camera4.k3: -0.000857367
Camera4.k4: -3.85742e-06

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1
Stereo.ThDepth: 10.0

Stereo.T_c1_c2: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [-0.0068170048829212515, -0.08600721437058802, -0.9962711917548495, -0.13978848152999235,
        0.04652263558992066, 0.9951882618617442, -0.08623205801995991, -0.004980008386097227,
        0.9988939747651819, -0.046937005963333486, -0.0027829209482704287, -0.12093502423553625,
        0.0, 0.0, 0.0, 1.0]
# Camera resolution
Camera.width: 800
Camera.height: 600

# Camera frames per second 
Camera.fps: 15

Stereo.b: 0.1849


# Lapping area between images (We must calculate)
Camera1.overlappingBegin: 0
Camera1.overlappingEnd: 300

Camera2.overlappingBegin: 0
Camera2.overlappingEnd: 300

Camera3.overlappingBegin: 0
Camera3.overlappingEnd: 800

Camera4.overlappingBegin: 0
Camera4.overlappingEnd: 800


# Transformation from body-frame (imu) to left camera
IMU.T_c1_c3: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.00348369, -0.00197191, 0.99999199, 0.04741809,
          0.99999365, 0.00076353, -0.00348219, -0.06272441,
          -0.00075666, 0.99999776, 0.00197456, -0.00873926,
          0, 0, 0, 1]

# Transformation from side-right camera to body-frame (imu)
IMU.T_c1_c4: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [-0.99988962, 0.01238942, 0.00820085, -0.00606784,
         0.0081229, -0.00632904, 0.99994698, 0.06457457,
         0.01244067, 0.99990322, 0.00622771, -0.00765811,
         0, 0, 0, 1]

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 300

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 4

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 8 
ORBextractor.minThFAST: 2

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0