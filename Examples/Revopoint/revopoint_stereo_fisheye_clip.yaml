%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

# Camera.type: "PinHole"

# # Left Camera calibration and distortion parameters (OpenCV)
# Camera1.fx: 250.0
# Camera1.fy: 250.0
# Camera1.cx: 150.0
# Camera1.cy: 150.0

# # Kannala-Brandt distortion parameters
# Camera1.k1: 0.0
# Camera1.k2: 0.0
# Camera1.k3: 0.0
# Camera1.p1: 0.0
# Camera1.p2: 0.0

# # Right Camera calibration and distortion parameters (OpenCV)
# Camera2.fx: 250.0
# Camera2.fy: 250.0
# Camera2.cx: 150.0
# Camera2.cy: 150.0

# # Kannala-Brandt distortion parameters
# Camera2.k1: 0.0
# Camera2.k2: 0.0
# Camera2.k3: 0.0
# Camera2.p1: 0.0
# Camera2.p2: 0.0

Camera.type: "KannalaBrandt8"

# Left Camera calibration and distortion parameters (OpenCV)
Camera1.fx: 250.0
Camera1.fy: 250.0
Camera1.cx: 150.0
Camera1.cy: 150.0

# Kannala-Brandt distortion parameters
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.k3: 0.0
Camera1.k4: 0.0

# Right Camera calibration and distortion parameters (OpenCV)
Camera2.fx: 250.0
Camera2.fy: 250.0
Camera2.cx: 150.0
Camera2.cy: 150.0

# Kannala-Brandt distortion parameters
Camera2.k1: 0.0
Camera2.k2: 0.0
Camera2.k3: 0.0
Camera2.k4: 0.0


# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1
Stereo.ThDepth: 5.0

Stereo.T_c1_c2: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [-0.0068170048829212515, -0.08600721437058802, -0.9962711917548495, -0.13978848152999235,
        0.04652263558992066, 0.9951882618617442, -0.08623205801995991, -0.004980008386097227,
        0.9988939747651819, -0.046937005963333486, -0.0027829209482704287, -0.12093502423553625,
        0.0, 0.0, 0.0, 1.0]
# Camera resolution
Camera.width: 300
Camera.height: 300

# Camera frames per second 
Camera.fps: 15

Stereo.b: 0.1849


# Lapping area between images (We must calculate)
Camera1.overlappingBegin: 0
Camera1.overlappingEnd: 300

Camera2.overlappingBegin: 0
Camera2.overlappingEnd: 300

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1250

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 4 

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 8 
ORBextractor.minThFAST: 2

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0